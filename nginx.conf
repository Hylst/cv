server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    access_log  /var/log/nginx/host.access.log;
    error_log   /var/log/nginx/host.error.log;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # -------------------------------------------------------------------------
    # EN-TETES DE SECURITE
    # Un CV qui revendique la securite applicative se fait auditer ici en
    # premier : ces en-tetes sont la partie visible de la demonstration.
    # -------------------------------------------------------------------------

    # Empeche le navigateur de "deviner" un type MIME different de celui annonce
    add_header X-Content-Type-Options "nosniff" always;

    # Interdit l'affichage du site dans une iframe tierce (clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Ne fuite pas l'URL complete vers les sites externes
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Coupe l'acces aux API sensibles dont ce site n'a aucun besoin
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Content-Security-Policy : liste blanche des origines autorisees.
    # Polices et icones sont auto-hebergees depuis la 3.3.3 : plus aucune
    # origine tierce dans style-src/font-src, donc plus aucune IP de visiteur
    # envoyee a Google ou cdnjs. 'unsafe-inline' reste necessaire pour les
    # styles et scripts inline encore presents dans index.html. A retirer des
    # que ces derniers seront sortis dans des fichiers dedies (voir CLAUDE.md).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # HSTS : n'a d'effet qu'en HTTPS. Le reverse proxy (Coolify/Traefik) gere le
    # certificat ; cet en-tete est inoffensif en HTTP et actif des le passage TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -------------------------------------------------------------------------
    # COMPRESSION
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/manifest+json;

    # -------------------------------------------------------------------------
    # CACHE
    # Le HTML doit toujours etre revalide (sinon une mise a jour du CV met des
    # jours a apparaitre), les assets peuvent etre caches longtemps.
    #
    # ATTENTION : on utilise UNIQUEMENT `expires` ici, jamais `add_header`.
    # Des qu'un bloc `location` declare son propre `add_header`, nginx cesse
    # d'heriter de TOUS ceux du bloc `server` parent -- les en-tetes de securite
    # ci-dessus disparaitraient silencieusement sur les fichiers concernes.
    # `expires` positionne Cache-Control sans declencher cette remise a zero.
    # -------------------------------------------------------------------------
    location = /index.html {
        expires -1;                 # -> Cache-Control: no-cache
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;                # -> Cache-Control: max-age=2592000
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        expires 7d;                 # -> Cache-Control: max-age=604800
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Pas d'exposition des fichiers caches (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
